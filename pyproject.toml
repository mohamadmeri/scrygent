[project]
name = "scrygent"
version = "0.1.0"
description = "A strictly typed compiler engine for data analysis that translates natural language into deterministic execution graphs."
readme = "README.md"
authors = [
    { name = "mohamadmeri", email = "mohammed.meri2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "matplotlib>=3.11.0",
    "numexpr>=2.14.1",
    "numpy>=2.1.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "plotly-stubs>=0.1.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.32.0",
    "streamlit>=1.59.1",
    "tqdm>=4.68.2",
    "types-tqdm>=4.69.0.20260724",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
    "pydantic>=2.7.0",
    "langgraph>=0.0.40",
    "mypy>=2.2.0",
    "pandas-stubs>=3.0.3.260530",
]

[tool.coverage.run]
source = ["src/scrygent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[tool.uv.pip]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not stress",
]

markers = [
    "stress: mark test as property-based fuzzing or extreme data shapes (deselected by default)",
    "hermetic: marks tests that must never touch the network or live LLMs",
    "boundary: marks tests targeting the ScrygentBaseModel JSON sanitization layer",
    "integration: marks tests exercising multiple Scrygent nodes end-to-end",
    "graph: marks tests exercising LangGraph routing and conditional edges",
]

filterwarnings = [
    "error",
    "ignore::DeprecationWarning:langchain_core.*",
    "ignore::DeprecationWarning:langchain_groq.*",
    "ignore::DeprecationWarning:langchain_openai.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore::pydantic.PydanticDeprecatedSince211",
]

tmp_path_retention_policy = "failed"
log_cli = false
log_cli_level = "WARNING"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP"]
ignore = ["D100", "D102", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"src/scrygent/prompts/*.py" = ["E501"]
"ui/*.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[project]
name = "scrygent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamadmeri", email = "mohammed.meri2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "matplotlib>=3.11.0",
    "numexpr>=2.14.1",
    "numpy>=2.1.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.32.0",
    "streamlit>=1.59.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/scrygent --cov-report=term-missing"

[tool.coverage.run]
source = ["src/scrygent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
exclude = ["^tests/"]